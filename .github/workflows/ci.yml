name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 22.14 is the minimum the package declares; 24 is the current LTS.
        node: ['22.14', '24']
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        # Skips node-gyp's rebuild of better-sqlite3, which fails on Windows
        # runners without build tools. Its prebuilt binary loads without it.
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Run the built command
        run: node dist/cli.js --version

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check that bin has no ./ prefix
        # npm silently strips a ./ prefix at publish time, which ships a
        # package with no command. Neither npm pack nor a local install shows it.
        run: |
          node -e "
            const { bin } = require('./package.json');
            const bad = Object.values(bin).filter(path => path.startsWith('./'));
            if (bad.length) {
              console.error('bin must not start with ./ :', bad.join(', '));
              process.exit(1);
            }
          "
      - name: Check the tarball lists the command
        run: npm pack --dry-run 2>&1 | tee pack.log && grep -q 'dist/cli.js' pack.log

  web:
    name: Browser page
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install a browser
        run: npx playwright install --with-deps chromium
      - name: Test the page in a real browser
        run: npm run test:web
