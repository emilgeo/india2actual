name: Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'web/**'
      - 'src/**'
      - 'scripts/build-web.mjs'
      - 'package-lock.json'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'web/**'
      - 'src/**'
      - 'scripts/build-web.mjs'
      - 'package-lock.json'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Build the convert page into the site
        run: |
          npm ci
          npm run build:web
          mkdir -p site/public/convert
          cp dist-web/convert.html site/public/convert/index.html
          cd site/public/convert
          sha256sum index.html > SHA256SUMS
      - name: Install, build and upload the site
        uses: withastro/action@v6
        with:
          path: ./site
          node-version: 22

  deploy:
    # Pull requests only build, so a broken site is caught before it merges.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
