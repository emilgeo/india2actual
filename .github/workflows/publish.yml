name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC); no npm token is stored.
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Node 24 bundles an npm that supports trusted publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Check the package metadata survives publishing
        run: |
          npm publish --dry-run --ignore-scripts 2>&1 | tee publish-dry-run.log
          if grep -qi "auto-corrected" publish-dry-run.log; then
            echo "npm auto-corrected package.json, fix it before publishing" >&2
            exit 1
          fi
      - name: Publish to npm
        run: npm publish

  pages:
    # The push page and the extension are attached to the release, with
    # fingerprints, so what a person downloads can be checked.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the pages and the extension
        run: |
          npm run build:web
          npm run build:extension
          (cd dist-extension && sha256sum India2Actual-extension.zip) >> dist-web/SHA256SUMS
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: >
          gh release upload "$TAG"
          dist-web/India2Actual.html
          dist-web/India2Actual-convert.html
          dist-extension/India2Actual-extension.zip
          dist-web/SHA256SUMS
          --clobber
